# Builds Blue Cench Chat for Windows (installer + portable) and Android (APK) on every push to main,
# and publishes them as the "latest" GitHub release with stable download links:
#   https://github.com/luckyrujugiro-alt/blue-cench-chat/releases/latest/download/BlueCenchChat-Setup.exe
#   https://github.com/luckyrujugiro-alt/blue-cench-chat/releases/latest/download/BlueCenchChat.apk
name: Build Blue Cench Chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.1.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        shell: bash
        run: sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$VERSION\"/" bluecenchchat/config.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build BlueCenchChat.exe
        run: python -m PyInstaller --noconfirm bluecenchchat.spec
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\bluecenchchat.iss
      - name: Zip portable app
        run: Compress-Archive -Path dist\BlueCenchChat\* -DestinationPath dist\BlueCenchChat-portable.zip -Force
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BlueCenchChat-windows
          path: |
            dist/BlueCenchChat-Setup.exe
            dist/BlueCenchChat-portable.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v$VERSION" dist/BlueCenchChat-Setup.exe dist/BlueCenchChat-portable.zip \
            --target "$GITHUB_SHA" --latest --title "Blue Cench Chat $VERSION" \
            --notes "PC: download BlueCenchChat-Setup.exe and run it. Android: BlueCenchChat.apk (added a few minutes later). iPhone/iPad: open the address shown in the PC app under Phones & Tablets, then Share > Add to Home Screen."

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android app
        run: gradle -p android assembleRelease --no-daemon --stacktrace -PappVersion="$VERSION" -PappCode="${{ github.run_number }}"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BlueCenchChat.apk
          gh release upload "v$VERSION" BlueCenchChat.apk --clobber
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueCenchChat-android
          path: BlueCenchChat.apk
