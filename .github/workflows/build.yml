# Builds BlueCenchChat.exe + installer on Windows and publishes them as a release.
# On the first run it also unpacks the uploaded source.zip into normal project files.
name: Build Blue Cench Chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source.zip (first run only)
        run: |
          if [ -f source.zip ]; then
            unzip -q -o source.zip -d . -x '.github/*'
            rm -f source.zip
            git config user.name "Blue Cench Chat bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Blue Cench Chat 1.0.0 source"
            git push
          fi

  build:
    needs: unpack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build BlueCenchChat.exe
        run: python -m PyInstaller --noconfirm bluecenchchat.spec
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\bluecenchchat.iss
      - name: Zip portable app
        run: Compress-Archive -Path dist\BlueCenchChat\* -DestinationPath dist\BlueCenchChat-portable-1.0.0.zip -Force
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BlueCenchChat-windows
          path: |
            dist/BlueCenchChat-Setup-1.0.0.exe
            dist/BlueCenchChat-portable-1.0.0.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>$null
          gh release create v1.0.0 dist\BlueCenchChat-Setup-1.0.0.exe dist\BlueCenchChat-portable-1.0.0.zip --title "Blue Cench Chat 1.0.0" --notes "Windows installer and portable app. Run BlueCenchChat-Setup-1.0.0.exe to install."

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android app
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BlueCenchChat-1.0.0.apk
          gh release upload v1.0.0 BlueCenchChat-1.0.0.apk --clobber
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueCenchChat-android
          path: BlueCenchChat-1.0.0.apk
