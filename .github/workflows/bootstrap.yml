# One-time setup: unpacks the uploaded source, commits it as normal files,
# then builds BlueCenchChat.exe + installer on Windows and publishes a release.
name: Unpack and build Blue Cench Chat

on:
  push:
    paths: ["source.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    outputs:
      unpacked: ${{ steps.unpack.outputs.unpacked }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source into the repository
        id: unpack
        run: |
          if [ -f source.zip ]; then
            unzip -q -o source.zip -d .
            rm -f source.zip .github/workflows/bootstrap.yml
            git config user.name "Blue Cench Chat bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Blue Cench Chat 1.0.0 source"
            git push
            echo "unpacked=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: unpack
    if: needs.unpack.outputs.unpacked == 'yes'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build BlueCenchChat.exe
        run: python -m PyInstaller --noconfirm bluecenchchat.spec
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\bluecenchchat.iss
      - name: Zip portable app
        run: Compress-Archive -Path dist\BlueCenchChat\* -DestinationPath dist\BlueCenchChat-portable-1.0.0.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 dist\BlueCenchChat-Setup-1.0.0.exe dist\BlueCenchChat-portable-1.0.0.zip --title "Blue Cench Chat 1.0.0" --notes "Windows installer and portable app. Run BlueCenchChat-Setup-1.0.0.exe to install."
